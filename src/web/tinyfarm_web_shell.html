<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TinyFarmRPG</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        "use strict";

        const canvasElement = document.getElementById("canvas");
        canvasElement.addEventListener("webglcontextlost", (event) => {
            console.warn("TinyFarmRPG WebGL context lost. Reload the page to recover.");
            event.preventDefault();
        }, false);

        var Module = {
            canvas: canvasElement,
            print: (...args) => console.log(...args),
            printErr: (...args) => console.error(...args),
            setStatus: (text) => {
                if (text) {
                    console.log("[TinyFarmRPG] " + text);
                }
            },
            monitorRunDependencies: (remaining) => {
                if (remaining === 0) {
                    console.log("[TinyFarmRPG] All downloads complete.");
                }
            },
        };

        window.addEventListener("load", () => {
            canvasElement.focus();
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
