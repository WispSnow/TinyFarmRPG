<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TinyFarmRPG</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #000;
        }

    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        "use strict";

        const canvasElement = document.getElementById("canvas");
        let webDebugApiDetected = false;
        let webDebugStartupApplied = false;
        let webDebugPollHandle = 0;

        function getWebDebugApi() {
            const module = typeof Module !== "undefined" ? Module : window.Module;
            if (typeof module === "undefined") {
                return null;
            }

            const available = module._tf_web_debug_ui_available;
            const togglePanel = module._tf_web_debug_toggle_panel;
            const setPanelVisible = module._tf_web_debug_set_panel_visible;
            if (typeof available !== "function" ||
                typeof togglePanel !== "function" ||
                typeof setPanelVisible !== "function") {
                return null;
            }

            webDebugApiDetected = true;
            return { available, togglePanel, setPanelVisible };
        }

        function isWebDebugAvailable() {
            const api = getWebDebugApi();
            return api !== null && api.available() !== 0;
        }

        function toggleWebDebugPanel(category) {
            const api = getWebDebugApi();
            if (api === null || api.available() === 0) {
                return false;
            }

            const toggled = api.togglePanel(category) !== 0;
            if (toggled) {
                canvasElement.focus();
            }
            return toggled;
        }

        function setWebDebugPanelVisible(category, visible) {
            const api = getWebDebugApi();
            if (api === null || api.available() === 0) {
                return false;
            }

            return api.setPanelVisible(category, visible ? 1 : 0) !== 0;
        }

        function applyWebDebugStartupState() {
            if (webDebugStartupApplied) {
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const requested = (params.get("debug-ui") || "").toLowerCase();
            if (requested === "engine" || requested === "all") {
                setWebDebugPanelVisible(0, true);
            }
            if (requested === "game" || requested === "all") {
                setWebDebugPanelVisible(1, true);
            }
            webDebugStartupApplied = true;
        }

        function refreshWebDebugApi() {
            if (!isWebDebugAvailable()) {
                return false;
            }

            applyWebDebugStartupState();
            return true;
        }

        function startWebDebugUiPolling() {
            if (webDebugPollHandle !== 0 || refreshWebDebugApi()) {
                return;
            }

            let attempts = 0;
            webDebugPollHandle = window.setInterval(() => {
                attempts += 1;
                if (refreshWebDebugApi() || attempts >= 120) {
                    window.clearInterval(webDebugPollHandle);
                    webDebugPollHandle = 0;
                }
            }, 100);
        }

        function debugCategoryForKey(event) {
            if (event.code === "F5") {
                return 0;
            }
            if (event.code === "F6") {
                return 1;
            }
            if (event.ctrlKey && event.shiftKey && !event.altKey) {
                if (event.code === "Digit5" || event.key === "5") {
                    return 0;
                }
                if (event.code === "Digit6" || event.key === "6") {
                    return 1;
                }
            }
            return null;
        }

        function shouldCaptureWebDebugShortcut() {
            return getWebDebugApi() !== null || webDebugApiDetected;
        }

        window.addEventListener("keydown", (event) => {
            const category = debugCategoryForKey(event);
            if (category === null || !shouldCaptureWebDebugShortcut()) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();
            toggleWebDebugPanel(category);
        }, { capture: true });

        canvasElement.addEventListener("webglcontextlost", (event) => {
            console.warn("TinyFarmRPG WebGL context lost. Reload the page to recover.");
            event.preventDefault();
        }, false);

        var Module = {
            canvas: canvasElement,
            print: (...args) => console.log(...args),
            printErr: (...args) => console.error(...args),
            setStatus: (text) => {
                if (text) {
                    console.log("[TinyFarmRPG] " + text);
                }
            },
            monitorRunDependencies: (remaining) => {
                if (remaining === 0) {
                    console.log("[TinyFarmRPG] All downloads complete.");
                }
            },
            postRun: [
                () => {
                    startWebDebugUiPolling();
                },
            ],
        };
        window.Module = Module;

        window.addEventListener("load", () => {
            canvasElement.focus();
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
